name: HeirStudio
options:
  bundleIdPrefix: com.heir.studio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 2Y8MR5FHTC
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  HeirStudio:
    type: application
    platform: iOS
    sources:
      - path: HeirStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heir.studio.mobile
        # Keep the product name space-free (module name + TEST_HOST derive from
        # it); the home-screen name comes from CFBundleDisplayName.
        PRODUCT_NAME: HeirStudio
        INFOPLIST_FILE: HeirStudio/Info.plist
        CODE_SIGN_ENTITLEMENTS: HeirStudio/HeirStudio.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO

  HeirStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HeirStudioTests
    dependencies:
      - target: HeirStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heir.studio.mobile.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HeirStudio:
    build:
      targets:
        HeirStudio: all
        HeirStudioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HeirStudioTests
    archive:
      config: Release
